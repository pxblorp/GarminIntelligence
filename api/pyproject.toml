[project]
name = "api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.104.1",
    "uvicorn>=0.24.0",
    "python-dotenv>=1.2.1",
    "pydantic>=2.0.0",
    "garmin-fit-sdk>=21.188.0",
    "libsql-client>=0.3.1",
    "pyjwt>=2.0.0",
    "passlib>=1.7.4",
    "garmy>=2.0.0",
]

[dependency-groups]
dev = [
    "alembic>=1.18.3",
    "ty>=0.0.13",
]

[tool.uv]
package = true

[tool.setuptools.packages.find]
where = ["src"]
