[project]
name = "api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.104.1",
    "uvicorn>=0.24.0",
    "python-dotenv>=1.2.1",
    "pydantic[email]>=2.0.0",
    "garmin-fit-sdk>=21.188.0",
    "libsql-client>=0.3.1",
    "pyjwt>=2.0.0",
    "passlib>=1.7.4",
    "bcrypt>=4.0.1",
    "garth>=0.6.3",
    "cryptography>=41.0.0",
]

[dependency-groups]
dev = [
    "alembic>=1.18.3",
    "httpx>=0.28.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=0.23.0",
    "ty>=0.0.13",
    "aiosqlite>=0.20.0",
]

[tool.uv]
package = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
